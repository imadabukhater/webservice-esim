name: Build

on:
  push:
    branches: [ main, shahn-salcom ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
      KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
      KS_ALIAS: ${{ secrets.KEY_ALIAS }}
      KS_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Prepare web folder
        run: |
          mkdir -p www ~/.android
          cp index.html firebase-config.js catalog.js www/
          cp node_modules/firebase/firebase-app-compat.js node_modules/firebase/firebase-auth-compat.js node_modules/firebase/firebase-firestore-compat.js www/
          cp debug.keystore ~/.android/

      - name: SHA-1 fingerprints (for Google sign-in - copy them into Firebase)
        run: |
          echo "=== Debug APK SHA-1 ==="
          keytool -list -v -keystore debug.keystore -storepass android | grep -E "SHA1|SHA256"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/up.jks"
            echo "=== Upload key (release AAB) SHA-1 ==="
            keytool -list -v -keystore "$RUNNER_TEMP/up.jks" -storepass "$KS_PASS" | grep -E "SHA1|SHA256"
            rm -f "$RUNNER_TEMP/up.jks"
          fi
          echo "Also add the 'App signing key' SHA-1 from Play Console > App integrity."

      - name: Add Android platform
        run: npx cap add android

      - name: Firebase config for push (optional)
        run: |
          if [ -f google-services.json ]; then
            cp google-services.json android/app/google-services.json
            echo "google-services.json copied - push notifications enabled"
          else
            echo "No google-services.json at repo root - phone push disabled (local notifications only)"
          fi

      - name: App icons (non-fatal)
        continue-on-error: true
        run: npx --yes @capacitor/assets generate --android --iconBackgroundColor '#0f766e' --splashBackgroundColor '#0f766e'

      - name: Permissions and version
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n</manifest>#' "$M"
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Sync
        run: npx cap sync android

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Build signed release AAB (only if signing secrets exist)
        if: env.KS_B64 != ''
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cd android
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KS_ALIAS" \
            -Pandroid.injected.signing.key.password="${KS_KEY_PASS:-$KS_PASS}"

      - name: Upload AAB (private, for Google Play)
        if: env.KS_B64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: shahn-raseed-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Publish debug APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: شحن سلكوم v${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
