name: Create upload keystore (run once, PRIVATE repo only)

on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          PASS=$(openssl rand -hex 12)
          keytool -genkeypair -v -keystore upload.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=Shahn Raseed, O=Shahn, C=IL"
          {
            echo "=== انسخ هذه القيم إلى Settings > Secrets and variables > Actions ==="
            echo "KEY_ALIAS    = upload"
            echo "KEYSTORE_PASSWORD = $PASS"
            echo "KEY_PASSWORD = $PASS"
            echo "KEYSTORE_BASE64 (السطر التالي كاملاً):"
            base64 -w0 upload.jks
            echo
          } | tee out.txt
      - uses: actions/upload-artifact@v4
        with:
          name: upload-keystore
          path: upload.jks
