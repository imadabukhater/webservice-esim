name: Deploy web app (Firebase Hosting)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'index.html', 'catalog.js', 'firebase-config.js', 'sw.js', 'manifest.webmanifest', 'web-icons/**', 'privacy.html' ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build web folder
        run: ./build-web.sh
      - name: Deploy to Firebase Hosting
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          echo "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@latest deploy --only hosting --project "$PROJECT_ID" --non-interactive
