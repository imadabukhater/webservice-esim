<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<title>شحن سلكوم</title>
<style>
:root{--p:#0f766e;--p2:#115e59;--pl:#ccfbf1;--bg:#f1f5f4;--card:#fff;--tx:#0f172a;--mu:#64748b;--ln:#e2e8f0;--rd:#dc2626;--gr:#16a34a;--or:#d97706;--bl:#2563eb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Noto Sans Arabic","Segoe UI",Tahoma,sans-serif;font-size:15px}
body{padding-bottom:calc(76px + var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px)))}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:var(--p);color:#fff;padding:calc(10px + var(--safe-area-inset-top,env(safe-area-inset-top,0px))) 16px 10px;display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;flex:1}
header .who{font-size:12px;opacity:.9}
.dot{width:9px;height:9px;border-radius:50%;background:#4ade80;display:inline-block;margin-inline-end:4px}
.dot.off{background:#fbbf24}
main{padding:12px 14px;max-width:720px;margin:0 auto}
nav{position:fixed;bottom:0;inset-inline:0;background:#fff;border-top:1px solid var(--ln);display:flex;padding-bottom:var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px));z-index:20}
nav button{flex:1;border:0;background:none;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mu);position:relative}
nav button span{font-size:20px;line-height:1}
nav button.on{color:var(--p);font-weight:700}
nav .bd{position:absolute;top:4px;inset-inline-start:calc(50% + 6px);background:var(--rd);color:#fff;border-radius:10px;font-size:10px;min-width:17px;height:17px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.card{background:var(--card);border-radius:16px;padding:12px;margin-bottom:10px;box-shadow:0 1px 2px rgba(15,23,42,.06)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.sub{color:var(--mu);font-size:12.5px;margin-top:2px}
.t{margin-top:8px;border-top:1px dashed var(--ln);padding-top:6px}
.end{text-align:end;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.num{direction:ltr;unicode-bidi:embed;display:inline-block}
.pill{font-size:11.5px;padding:2px 9px;border-radius:20px;background:#e2e8f0;color:#334155;white-space:nowrap}
.pill.pending{background:#fef3c7;color:#92400e}.pill.done,.pill.active{background:#dcfce7;color:#166534}
.pill.rejected,.pill.disconnected{background:#fee2e2;color:#991b1b}.pill.cancelled,.pill.refunded{background:#e2e8f0;color:#475569}
.logo{border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex:none;object-fit:contain;background:#fff}
.btn{display:block;width:100%;border:0;background:var(--p);color:#fff;padding:13px;border-radius:12px;font-weight:700;margin-top:10px}
.btn.s{background:#e2f5f2;color:var(--p2)}.btn.d{background:#fee2e2;color:#991b1b}.btn.w{background:#fff;border:1px solid var(--ln);color:var(--tx)}
.btn:disabled{opacity:.5}
.btns{display:flex;gap:8px}.btns .btn{flex:1}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chip{border:1px solid var(--ln);background:#fff;padding:7px 14px;border-radius:20px;white-space:nowrap;font-size:13.5px}
.chip.on{background:var(--p);color:#fff;border-color:var(--p)}
.f{display:block;margin-top:10px}.f span{display:block;font-size:12.5px;color:var(--mu);margin-bottom:4px}
.f input,.f select,.f textarea,.search{width:100%;border:1px solid #cbd5e1;border-radius:12px;padding:11px 12px;background:#fff;outline:none}
.f input:focus,.f select:focus,.f textarea:focus,.search:focus{border-color:var(--p);box-shadow:0 0 0 3px var(--pl)}
.search{margin-bottom:10px}
.chk{display:flex;align-items:center;gap:8px;margin-top:12px}.chk input{width:20px;height:20px}
.big{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.big button{border:0;border-radius:16px;padding:16px 4px;background:#fff;box-shadow:0 1px 2px rgba(15,23,42,.08);display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:13px}
.big button span{font-size:28px}
.bal{background:linear-gradient(135deg,var(--p),#0e9488);color:#fff;border-radius:18px;padding:16px;margin-bottom:6px}
.bal b{font-size:30px;display:block;margin-top:2px}
.bal.ok{background:linear-gradient(135deg,#166534,#16a34a)}
.bal.low{background:linear-gradient(135deg,#991b1b,#dc2626)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:#fff;border-radius:14px;padding:10px;text-align:center}.stats b{display:block;font-size:20px}.stats small{color:var(--mu)}
h3{margin:14px 2px 8px;font-size:15px}
.empty{text-align:center;color:var(--mu);padding:30px 10px}
.fab{position:fixed;inset-inline-start:16px;bottom:calc(88px + var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px)));width:56px;height:56px;border-radius:50%;border:0;background:var(--p);color:#fff;font-size:30px;box-shadow:0 4px 12px rgba(0,0,0,.25);z-index:15}
.ov{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sh{background:#f8fafc;width:100%;max-width:720px;max-height:92vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:up .2s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.shh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--ln)}
.x{border:0;background:#e2e8f0;border-radius:50%;width:32px;height:32px}
.shb{padding:6px 16px calc(18px + var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px)));overflow:auto}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #eef2f7;gap:10px}.kv span:first-child{color:var(--mu)}
#toast{position:fixed;bottom:calc(90px + var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px)));inset-inline:16px;margin:auto;max-width:420px;background:#0f172a;color:#fff;padding:11px 14px;border-radius:12px;text-align:center;z-index:99;display:none}
.auth{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px;max-width:420px;margin:auto}
.auth .brand{text-align:center;margin-bottom:14px}.auth .brand>div:first-child{font-size:54px}.auth .brand .sub{font-size:13.5px;line-height:1.6}.auth h2{margin:4px 0}
.err{color:var(--rd);font-size:13px;margin-top:8px;min-height:18px}
.demo{background:#fef3c7;color:#92400e;border-radius:10px;padding:8px 10px;font-size:12.5px;margin-bottom:10px}
.offer{background:linear-gradient(135deg,#fff7ed,#ffedd5);border:1px solid #fed7aa}
.link{background:none;border:0;color:var(--p);padding:10px;width:100%;margin-top:6px}
.neg{color:var(--rd)}.pos{color:var(--gr)}
.prev{background:var(--pl);color:var(--p2);border-radius:10px;padding:8px 10px;margin-top:10px;font-weight:700;min-height:36px}
.logoprev{display:flex;align-items:center;gap:10px;margin-top:10px}
.btn.wa{background:#25d366;color:#04361a}
.hb{border:0;background:rgba(255,255,255,.2);color:#fff;border-radius:50%;width:38px;height:38px;font-size:18px;flex:none}
.or{color:var(--or)}
.pill.open{background:#fef3c7;color:#92400e}.pill.resolved{background:#dcfce7;color:#166534}
.opt{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--ln);border-radius:12px;padding:12px;margin-top:8px}.opt input{width:20px;height:20px}.opt:has(input:checked){border-color:var(--p);background:var(--pl)}
nav button{font-size:10.5px}
.big button{text-align:center;line-height:1.35}
.cos{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.cot{flex:none;width:84px;border:2px solid transparent;background:#fff;border-radius:14px;padding:8px 4px;font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 1px 2px rgba(15,23,42,.06)}
.cot.on{border-color:var(--p);background:var(--pl)}
.pkt{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:8px;cursor:pointer}
.pkt:active{border-color:var(--p)}
.pr{font-size:18px;color:var(--p2)}
.fx{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.fx i{font-style:normal;background:#f1f5f9;border-radius:8px;padding:3px 8px;font-size:12px}
details.pkd{margin-top:6px;font-size:12.5px;color:var(--mu);line-height:1.6}details.pkd summary{color:var(--p);cursor:pointer}
.ch2{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.ch2 button{display:flex;align-items:center;gap:12px;text-align:start;border:1px solid var(--ln);background:#fff;border-radius:16px;padding:16px}
.ch2 button>span{font-size:30px}.ch2 button b{display:block;font-size:16px}.ch2 button small{color:var(--mu)}
.ostrip{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.ostrip .oc{flex:none;width:150px;border-radius:14px;padding:10px;border:1px solid #fed7aa;background:linear-gradient(135deg,#fff7ed,#ffedd5)}
.sug{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.sug button{border:1px solid var(--ln);background:#fff;border-radius:10px;padding:6px 10px}
.ordiv{display:flex;align-items:center;gap:10px;color:var(--mu);margin:14px 0 4px;font-size:13px}.ordiv:before,.ordiv:after{content:'';flex:1;height:1px;background:#cbd5e1}
.btn.g{background:#fff;color:var(--tx);border:1px solid #cbd5e1;display:flex;align-items:center;justify-content:center;gap:8px}
.hlp{background:#fff;border:1px solid #e2e8f0;border-radius:12px;margin:8px 0;padding:0 12px}.hlp summary{padding:12px 0;font-weight:700;cursor:pointer}.hlp .hb2{padding:0 0 12px;line-height:1.8;font-size:14px}.hlp ol,.hlp ul{margin:4px 0;padding-inline-start:20px}

</head>

const money=n=>(Math.round((+n||0)*100)/100).toLocaleString('en-US')+' ₪';

const pad=n=>String(n).padStart(2,'0');

const AR_RUN=/[ء-ي٠-٩ٰ-ۓ][ء-يً-ٰٟ-ۓـ\s،؟]*[ء-يً-ٰٟ-ۓـ؟]|[ء-ي]/g;
const EN_RULES=[[/بعد (\d+) يوم/g,'in $1 days'],[/منذ (\d+) يوم/g,'$1 days ago'],[/\(\+(\d+) عروض أخرى\)/g,'(+$1 more offers)'],[/(\d+) نتيجة/g,'$1 results']];
function trRun(r){
  const k=r.replace(/\s+/g,' ').trim();if(EN[k]!=null)return EN[k];
  const w=k.split(' '),out=[];let i=0;
  while(i<w.length){let j=w.length,hit=null;for(;j>i;j--){const q=w.slice(i,j).join(' ');if(EN[q]!=null){hit=EN[q];break}}
    if(hit!=null){out.push(hit);i=j}else{out.push(w[i]);i++}}
  return out.join(' ');
}
function T(x){
  if(LANG!=='en'||!x||!/[؀-ۿ]/.test(x))return x;
  let t=String(x);EN_RULES.forEach(([a,b])=>{t=t.replace(a,b)});
  return t.replace(AR_RUN,m=>trRun(m));
}
const SKIP='[translate=no],script,style,textarea';
function trNode(n){
  if(LANG!=='en'||!n)return;
  if(n.nodeType===3){const p=n.parentElement;if(!p||p.closest(SKIP)||!/[؀-ۿ]/.test(n.data))return;const v=T(n.data);if(v!==n.data)n.data=v;return}
  if(n.nodeType!==1||n.closest(SKIP))return;
  const w=document.createTreeWalker(n,NodeFilter.SHOW_TEXT),ns=[];while(w.nextNode())ns.push(w.currentNode);
  ns.forEach(t=>trNode(t));
  [n,...n.querySelectorAll('[placeholder],[aria-label]')].forEach(e=>['placeholder','aria-label'].forEach(a=>{const v=e.getAttribute(a);if(v&&/[؀-ۿ]/.test(v)&&!e.closest(SKIP))e.setAttribute(a,T(v))}));
}
function langInit(){
  document.documentElement.lang=LANG;document.documentElement.dir=LANG==='en'?'ltr':'rtl';
  if(LANG!=='en')return;
  document.title='Recharge';
  new MutationObserver(ms=>ms.forEach(m=>{if(m.type==='characterData')trNode(m.target);else m.addedNodes.forEach(trNode)})).observe(document.body,{childList:true,subtree:true,characterData:true});
}

const sheets=[];let hist=false,skip=0;
function pushH(){if(!hist){history.pushState({sh:1},'');hist=true}}
function popH(){setTimeout(()=>{if(!sheets.length&&hist){hist=false;skip++;history.back()}},60)}
window.addEventListener('popstate',()=>{if(skip){skip--;return}hist=false;if(sheets.length){sheets.pop().remove();if(sheets.length)pushH()}});
function sheet(title,body,live){
  const el=document.createElement('div');el.className='ov';
  el.innerHTML=`<div class="sh"><div class="shh"><b>${esc(title)}</b><button class="x" data-close>✕</button></div><div class="shb"></div></div>`;
  const b=$('.shb',el);
  if(live){el.refresh=()=>{b.innerHTML=live()};el.refresh()}else b.innerHTML=body;
  el.addEventListener('click',e=>{if(e.target===el||e.target.closest('[data-close]'))closeSheet(el)});
  $('#modals').appendChild(el);sheets.push(el);pushH();return el;
}
function closeSheet(el){const i=sheets.indexOf(el||sheets[sheets.length-1]);if(i<0)return;const s=sheets.splice(i,1)[0];s.remove();s.onclose&&s.onclose();popH()}
function confirmBox(msg,okText='تأكيد',danger){
  return new Promise(res=>{
    const el=sheet('تأكيد',`<p>${esc(msg)}</p><div class="btns"><button class="btn w" data-close>إلغاء</button><button class="btn ${danger?'d':''}" data-ok>${okText}</button></div>`);
    let done=false;el.onclose=()=>{if(!done)res(false)};
    $('[data-ok]',el).onclick=()=>{done=true;closeSheet(el);res(true)};
  });
}

    if(un.toLowerCase()!==ADMIN_USER)throw{message:'غير مسموح'};

  start(p,cb){this.prof=p;this.cb=cb;this.emit()},

    const me=D.users.find(x=>x.id===p.id);cb('me',me?this.pub(me):null);

    });

  },

};

/* إشعار العروض الجديدة / المحدَّثة للوكيل */
function offerCheck(docs){
  if(!S.me)return;
  const k='shahn_offseen_'+S.me.id;let seen=0;try{seen=+localStorage.getItem(k)||0}catch(e){}
  const live=docs.filter(p=>p.isOffer&&pkLive(p)&&p.notifyAt);
  const mx=Math.max(seen||Date.now(),...docs.map(p=>+p.notifyAt||0));
  if(seen){const fresh=live.filter(p=>p.notifyAt>seen).sort((a,b)=>b.notifyAt-a.notifyAt);
    if(fresh.length){const p=fresh[0],c=co(p.companyId);notify('عرض جديد 🎁',(c?c.name+': ':'')+p.name+' — '+money(p.price)+(fresh.length>1?' (+'+(fresh.length-1)+' عروض أخرى)':''))}}
  try{localStorage.setItem(k,String(mx))}catch(e){}
}
/* ====================== بيانات واردة ====================== */
let rT,errShown=false;
function onData(col,docs,err){
  if(err){if(!errShown){errShown=true;toast(errMsg(err))}return}
  if(col==='me'){
    if(!docs){doLogout();return}
    if(docs.active===false&&!docs.pending){doLogout();toast('تم تعطيل هذا الحساب');return}
    const was=S.me&&S.me.pending;S.me=docs;
    if(was&&!docs.pending){B.stop();S.known=new Map();S.ordInit=false;S.tab='home';B.start(docs,onData);notify('تم تفعيل حسابك','يمكنك الآن إرسال الطلبات')}
    clearTimeout(rT);rT=setTimeout(()=>{if(S.me)render()},60);return;
  }
  S[col]=docs;
  if(col==='users'&&isAdmin()){
    if(S.usersInit)docs.forEach(u=>{if(!S.knownU.has(u.id)&&u.pending)notify('وكيل جديد',(u.name||u.username)+' بانتظار التفعيل')});
    docs.forEach(u=>S.knownU.set(u.id,1));S.usersInit=true;
  }
  if(col==='orders'){
    if(S.ordInit){
      docs.forEach(o=>{
        const old=S.known.get(o.id);
        if(isAdmin()){if(old===undefined&&o.status==='pending')notify('طلب جديد',(o.agentName||'')+' — '+TYPE[o.type])}
        else if(old==='pending'&&(o.status==='done'||o.status==='rejected'))notify(o.status==='done'?'تم تنفيذ طلبك':'تم رفض طلبك',TYPE[o.type]+(o.number?' '+o.number:''));
      });
    }
    docs.forEach(o=>S.known.set(o.id,o.status));S.ordInit=true;
  }
  if(col==='packages'&&!isAdmin())offerCheck(docs);
  if(col==='payments'&&!isAdmin()){
    if(S.payInit)docs.forEach(p=>{if(S.knownP.has(p.id)||p.kind==='debt')return;if(p.kind==='adjust')notify('تم تعديل رصيدك',((+p.amount>0)?'+':'−')+money(Math.abs(p.amount))+(p.note?' — '+p.note:''));else notify('تم شحن رصيدك','+'+money(p.amount))});
    docs.forEach(p=>S.knownP.set(p.id,1));S.payInit=true;
  }
  if(col==='tickets'){
    if(S.tkInit)docs.forEach(t=>{const old=S.knownT.get(t.id);
      if(isAdmin()){if(old===undefined&&t.status==='open')notify('رسالة دعم جديدة',(t.agentName||'')+' — '+tkName(t.kind))}
      else if(old==='open'&&t.status==='resolved')notify('تم حل طلب الدعم',tkName(t.kind)+' '+(t.number||''))});
    docs.forEach(t=>S.knownT.set(t.id,t.status));S.tkInit=true;
  }
  clearTimeout(rT);rT=setTimeout(()=>{if(S.me)render();sheets.forEach(s=>s.refresh&&s.refresh())},60);
}

  const c=co(o.companyId);const amt=o.status==='done'?o.amount:(o.suggested!=null?o.suggested:o.reqAmount);
  return`<div class="card" data-act="orderOpen" data-id="${o.id}"><div class="row">${logo(c,42)}<div class="grow"><b>${TYPE[o.type]||o.type}</b>${o.no?' <span class="sub num">#'+o.no+'</span>':''}
  <div class="sub">${esc(c?c.name:'—')}${o.number?' • <span class="num">'+esc(o.number)+'</span>':o.account?' • <span class="num">'+esc(o.account)+'</span>':''}</div>
  ${adm?`<div class="sub">👤 ${esc(o.agentName||'')}</div>`:''}${adm&&o.status==='pending'&&bal(o.agentId)<(+o.suggested||0)?'<div class="sub neg">⚠️ رصيد الوكيل غير كافٍ</div>':''}</div>
  <div class="end"><b>${money(amt)}</b>${pill(o.status)}</div></div>

function viewOrders(){
  const f=S.ui.ofilter,adm=isAdmin();
  const tg=`<div class="chips">${[['orders','الطلبات'],['support','رسائل الدعم ('+openTk()+')']].map(c=>`<button class="chip ${(S.ui.otab||'orders')===c[0]?'on':''}" data-act="set" data-k="otab" data-v="${c[0]}">${c[1]}</button>`).join('')}</div>`;
  if(S.ui.otab==='support')return tg+viewTickets();
  const cnt=s=>S.orders.filter(o=>o.status===s).length;
  const chips=[['pending','قيد الانتظار ('+cnt('pending')+')'],['done','منفّذة'],['rejected','مرفوضة'],['all','الكل']];
  let l=S.orders.filter(o=>f==='all'||o.status===f||(f==='rejected'&&(o.status==='cancelled'||o.status==='refunded')));

/* ---- رئيسية الوكيل ---- */
function homeSearch(){
  const raw=(S.ui.hq||'').trim();if(!raw)return'';
  const isNum=/^[\d\s+\-()٠-٩۰-۹]+$/.test(raw);let q=digits(raw);if(q.startsWith('972'))q='0'+q.slice(3);
  const qt=raw.toLowerCase();
  const l=S.lines.filter(x=>isNum?((x.number||'').includes(q)||(x.sim||'').includes(q)):((x.customerName||'').toLowerCase().includes(qt)||(x.number||'').includes(q)&&q.length>=3)).sort((a,b)=>(a.number||'').localeCompare(b.number||'')).slice(0,30);
  return l.length?`<div class="sub" style="margin-bottom:6px">${l.length} نتيجة</div>`+l.map(lineCard).join(''):'<div class="empty" style="padding:14px">لا توجد نتائج ضمن خطوطك.</div>';
}
function homeOffers(){
  const l=S.packages.filter(p=>p.isOffer&&pkLive(p)&&(!co(p.companyId)||co(p.companyId).active!==false));

}

/* ---- الخطوط ---- */
function linesFiltered(){
  const q=digits(S.ui.q),qt=(S.ui.q||'').trim().toLowerCase(),now=Date.now();
  return S.lines.filter(l=>{
    if(S.ui.lst==='soon'){if(!(l.status==='active'&&l.expiresAt&&l.expiresAt-now<=6048e5))return false}
    else if(S.ui.lst!=='all'&&l.status!==S.ui.lst)return false;
    if(isAdmin()){if(S.ui.fag&&l.agentId!==S.ui.fag)return false;if(S.ui.fco&&l.companyId!==S.ui.fco)return false}
    if(!qt)return true;
    return(q&&((l.number||'').includes(q)||(l.sim||'').includes(q)))||(l.customerName||'').toLowerCase().includes(qt);
  }).sort((a,b)=>(a.number||'').localeCompare(b.number||''));
}
const fmtD=t=>{const d=new Date(t);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()};
function expLine(l){
  if(!l.expiresAt)return'';
  const d=Math.ceil((l.expiresAt-Date.now())/864e5);
  return`<div class="sub ${d<0?'neg':d<=7?'or':''}">ينتهي ${fmtD(l.expiresAt)} (${d<0?'منتهٍ':'بعد '+d+' يوم'})</div>`;
}
function lineCard(l){
  const c=co(l.companyId),p=pk(l.packageId),a=isAdmin()?ag(l.agentId):null;
  return`<div class="card" data-act="lineOpen" data-id="${l.id}"><div class="row">${logo(c,40)}<div class="grow"><b class="num">${esc(l.number)}</b>${l.esim?' <span class="pill active">eSIM</span>':''}
  <div class="sub">${esc(l.customerName||'بدون اسم')} • ${esc(c?c.name:'')}${p?' • '+esc(p.name):''}</div>${l.sim?`<div class="sub">SIM: <span class="num">${esc(l.sim)}</span></div>`:''}${expLine(l)}${a?`<div class="sub">👤 ${esc(a.name||a.username)}</div>`:''}</div>${pill(l.status)}</div></div>`;
}
const linesList=()=>{const l=linesFiltered();return l.length?l.map(lineCard).join(''):'<div class="empty">لا توجد خطوط</div>'};

  ${adm?`<div class="btns"><label class="f" style="flex:1;margin:0 0 8px"><select data-sel="fag"><option value="">كل الوكلاء</option>${agents().map(a=>`<option value="${a.id}"${S.ui.fag===a.id?' selected':''}>${esc(a.name||a.username)}</option>`).join('')}</select></label>

/* ---- الشركات والباقات ---- */
function pkCard(p,adm){
  const c=co(p.companyId);const exp=p.offerEnd&&p.offerEnd<today();
  const kl=isGame(c)?'ألعاب وتطبيقات':pkKind(p)==='card'?'كرت':'فاتورة';
  return`<div class="card ${p.isOffer?'offer':''}" ${adm?`data-act="pkEdit" data-id="${p.id}"`:`data-act="pkOrder" data-id="${p.id}"`}><div class="row">${logo(c,40)}<div class="grow"><b>${esc(p.name)}</b>${p.isOffer?' 🎁':''}${p.active===false?' <span class="pill disconnected">موقوفة</span>':''}${exp?' <span class="pill disconnected">منتهي</span>':''}
  <div class="sub">${esc(c?c.name:'')} • ${kl}${pkInfo(p)?' • '+pkInfo(p):''}</div>${p.desc&&adm?`<div class="sub" translate="no">${esc(p.desc.length>90?p.desc.slice(0,90)+'…':p.desc)}</div>`:''}${p.offerEnd?`<div class="sub">ينتهي العرض: ${esc(p.offerEnd)}</div>`:''}</div>
  <div class="end"><b>${money(p.price)}</b></div></div>${!adm&&p.desc?`<details class="pkd"><summary>التفاصيل</summary><span translate="no">${esc(p.desc)}</span></details>`:''}</div>`;
}
function viewCatalog(){
  const t=S.ui.cat;
  let body='';
  if(t==='companies'){
    body=S.companies.length?S.companies.map(c=>{
      const fl=isGame(c)?'🎮 ألعاب وتطبيقات':[c.card!==false?'كروت':'',c.bill!==false?'فواتير':'',c.free?'مبلغ حر':''].filter(Boolean).join(' • ')+(+c.commission?' • عمولة '+(+c.commission)+'%':'');
      return`<div class="card" data-act="coEdit" data-id="${c.id}"><div class="row">${logo(c,46)}<div class="grow"><b>${esc(c.name)}</b>${c.active===false?' <span class="pill disconnected">موقوفة</span>':''}
      <div class="sub">${S.packages.filter(p=>p.companyId===c.id).length} باقة • ${fl}</div></div></div></div>`}).join('')
    :'<div class="empty">لا توجد شركات.</div>';
  }else{
    const ok=p=>{const c=co(p.companyId);return t==='offers'?p.isOffer:t==='games'?isGame(c):t==='cards'?(!isGame(c)&&pkKind(p)==='card'):(!isGame(c)&&pkKind(p)==='bill')};
    const l=S.packages.filter(ok).sort((a,b)=>(a.companyId||'').localeCompare(b.companyId||''));
    body=l.length?l.map(p=>pkCard(p,true)).join(''):'<div class="empty">لا توجد عناصر</div>';
  }
  const kind=t==='cards'?'card':t==='games'?'game':'bill';
  return`<div class="chips">${[['companies','الشركات'],['packages','باقات الفواتير'],['cards','باقات الكروت'],['games','ألعاب وتطبيقات'],['offers','العروض']].map(c=>`<button class="chip ${t===c[0]?'on':''}" data-act="set" data-k="cat" data-v="${c[0]}">${c[1]}</button>`).join('')}</div>${t==='companies'?(catVer()!==CAT.ver?'<div class="demo">🆕 يتوفر تحديث للكتالوج (باقات وأسعار جديدة). اضغط الزر أدناه لإضافة الناقص فقط.</div>':'')+'<button class="btn s" data-act="coDefaults">＋ إضافة / تحديث الشركات والباقات الافتراضية</button>'+(S.companies.length?'<button class="btn s" data-act="addBillDef">＋ إضافة باقات الفاتورة الافتراضية (500 جيجا و150 جيجا) لكل الشركات</button>':''):''}${body}

  ${l.length?l.map(p=>pkCard(p,false)).join(''):'<div class="empty">لا توجد عروض حالياً</div>'}`;

/* ---- حسابي / المزيد ---- */
function statement(aid){
  const rows=[];
  S.orders.filter(o=>o.agentId===aid&&o.status==='done').forEach(o=>rows.push({t:o.doneAt||o.createdAt,d:-(+o.amount||0),txt:(TYPE[o.type]||'')+' — '+((co(o.companyId)||{}).name||'')+(o.number?' '+o.number:'')}));
  S.payments.filter(p=>p.agentId===aid).forEach(p=>rows.push({t:p.createdAt,d:p.kind==='debt'?-(+p.amount||0):(+p.amount||0),txt:(p.kind==='debt'?'خصم / تسوية':p.kind==='adjust'?'تصحيح رصيد':'شحن رصيد')+(p.note?' — '+p.note:'')}));
  rows.sort((a,b)=>a.t-b.t);let r=0;rows.forEach(x=>{r+=x.d;x.bal=r});return rows.reverse();
}
const stmtHTML=aid=>{const s=statement(aid);return s.length?s.map(x=>`<div class="kv"><span>${fmt(x.t)}<br><small>${esc(x.txt)}</small></span><span style="text-align:end"><b class="${x.d>0?'pos':'neg'}">${x.d>0?'+':'−'}${money(Math.abs(x.d))}</b><br><small>الرصيد ${money(x.bal)}</small></span></div>`).join(''):'<div class="empty">لا توجد حركات</div>'};
/* ---- المحاسبة التلقائية ---- */
function perFrom(){
  const p=S.ui.per||'month',d=new Date();d.setHours(0,0,0,0);
  if(p==='today')return d.getTime();

function acct(aid){
  const from=perFrom();const r={act:{n:0,s:0},card:{n:0,s:0},bill:{n:0,s:0},game:{n:0,s:0},adj:0,esim:{n:0,s:0},pay:0,debt:0,total:0,co:{}};
  S.orders.forEach(o=>{
    if(o.status!=='done'||(aid&&o.agentId!==aid))return;
    const t=o.doneAt||o.createdAt;if(t<from)return;
    const k=o.type.startsWith('activate')?'act':o.type;if(!r[k])return;
    const a=+o.amount||0;r[k].n++;r[k].s+=a;r.total+=a;if(k==='act'&&o.esim){r.esim.n++;r.esim.s+=+o.esimFee||0}
    const cn=(co(o.companyId)||{}).name||'—';r.co[cn]=(r.co[cn]||0)+a;
  });
  S.payments.forEach(p=>{
    if((aid&&p.agentId!==aid)||p.createdAt<from)return;
    if(p.kind==='debt')r.debt+=+p.amount||0;else if(p.kind==='adjust')r.adj+=+p.amount||0;else r.pay+=+p.amount||0;
  });
  return r;
}

const DEF_COS=CAT.cos,DEF_GAMES=CAT.games||[];
const normN=x=>String(x||'').replace(/\s+/g,'').toLowerCase();
function seedOps(){
  const ops=[],now=Date.now();let k=S.companies.length;
  DEF_COS.forEach(d=>{
    const keys=[d.n].concat(d.al||[]).map(normN);
    const ex=S.companies.find(c=>keys.includes(normN(c.name)));let id;
    if(ex){id=ex.id;if(d.free&&!ex.free)ops.push({t:'set',c:'companies',id,d:{free:true,minAmt:d.minAmt||10,card:true}})}
    else{id=B.newId('companies');ops.push({t:'set',c:'companies',id,d:{name:d.n,kind:'tel',commission:0,active:true,order:k++,card:true,bill:d.bill!==false,free:!!d.free,minAmt:d.minAmt||0,createdAt:now}})}
    if(d.bill!==false)ops.push(...billDefOps([id]));
    (d.cards||[]).forEach(c=>{
      if(S.packages.some(p=>p.companyId===id&&pkKind(p)==='card'&&normN(p.name)===normN(c.name)))return;
      ops.push({t:'set',c:'packages',id:B.newId('packages'),d:{companyId:id,kind:'card',name:c.name,minutes:c.minutes||0,sms:c.sms||0,gb:c.gb||0,unlimited:false,days:c.days||30,price:c.price,desc:c.desc||'',isOffer:false,offerEnd:'',active:!c.off,createdAt:now}});
    });
  });
  DEF_GAMES.forEach(n=>{
    if(S.companies.some(c=>normN(c.name)===normN(n)))return;
    ops.push({t:'set',c:'companies',id:B.newId('companies'),d:{name:n,kind:'game',commission:0,active:true,order:k++,createdAt:now}});
  });
  return ops;
}
function billDefOps(ids){
  const ops=[];
  ids.forEach(cid=>{
    (CAT.billDefaults||[]).forEach(d=>{
      if(S.packages.some(p=>p.companyId===cid&&+p.gb===+d.gb&&+p.price===+d.price&&pkKind(p)==='bill'))return;
      ops.push({t:'set',c:'packages',id:B.newId('packages'),d:{companyId:cid,kind:'bill',name:d.name,gb:d.gb,unlimited:false,days:30,price:d.price,desc:'',isOffer:false,offerEnd:'',active:true,createdAt:Date.now()}});
    });
  });
  return ops;
}

    ${l.map(pkTile).join('')||(!c.free?'<div class="empty">لا توجد باقات لهذه الشركة</div>':'')}`;

function fileToLogo(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();r.onerror=rej;
    r.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{
      const m=160,k=Math.min(1,m/Math.max(im.width,im.height));const cv=document.createElement('canvas');
      cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
      let u=cv.toDataURL('image/png');if(u.length>150000)u=cv.toDataURL('image/jpeg',.8);res(u)};im.src=r.result};
    r.readAsDataURL(file);
  });
}

    if(!k)return er.textContent='اختر نوع الطلب';
    const t={agentId:S.me.id,agentName:S.me.name||S.me.username,number,kind:k.value,note:V(el,'note'),status:'open',createdAt:Date.now()};
    if(await W([{t:'set',c:'tickets',id:B.newId('tickets'),d:t}])){
      closeSheet(el);
      const d=sheet('تم إرسال رسالتك','<p>وصلت رسالتك إلى الدعم الفني، وسيصلك إشعار هنا عند الرد.</p><button class="btn wa" data-go>💬 إرسالها أيضاً عبر واتساب</button><button class="btn w" data-close>إغلاق</button>');
      $('[data-go]',d).onclick=()=>openWA(ticketMsg(t));
    }
  };
}
function tkSheet(id){
  const el=sheet('رسالة دعم','',()=>{
    const t=S.tickets.find(x=>x.id===id);if(!t)return'<div class="empty">غير موجودة</div>';
    const adm=isAdmin(),ln=adm&&S.lines.find(l=>l.number===digits(t.number));
    const kv=(k,v)=>v?`<div class="kv"><span>${k}</span><b>${v}</b></div>`:'';
    return`<div class="card">${kv('النوع',tkIcon(t.kind)+' '+esc(tkName(t.kind)))}${kv('الرقم','<span class="num">'+esc(t.number)+'</span>')}${kv('الحالة',pill(t.status))}${adm?kv('الوكيل',esc(t.agentName)):''}
    ${kv('ملاحظة الوكيل',esc(t.note))}${kv('التاريخ',fmt(t.createdAt))}${kv('رد الدعم',esc(t.reply))}${kv('وقت الحل',fmt(t.resolvedAt))}</div>
    ${adm&&t.status==='open'?'<button class="btn" data-a="res">تم الحل / رد على الوكيل</button>':''}
    ${adm?'<button class="btn wa" data-a="waAgent">💬 مراسلة الوكيل على واتساب</button>':'<button class="btn wa" data-a="wa">💬 إرسالها عبر واتساب</button>'}
    ${ln?'<button class="btn w" data-a="line">فتح الخط</button>':''}`;
  });
  el.addEventListener('click',e=>{
    const x=e.target.closest('[data-a]');if(!x)return;const t=S.tickets.find(y=>y.id===id);if(!t)return;
    if(x.dataset.a==='wa')openWA(ticketMsg(t));
    if(x.dataset.a==='waAgent'){const u=ag(t.agentId);openWA('مرحباً '+((u&&u.name)||'')+'، بخصوص طلب الدعم: '+tkName(t.kind)+' '+t.number,u&&(u.whatsapp||u.phone))}
    if(x.dataset.a==='line'){const ln=S.lines.find(l=>l.number===digits(t.number));if(ln)lineSheet(ln.id)}
    if(x.dataset.a==='res'){
      const f=sheet('تم الحل',F.area('reply','رد للوكيل (اختياري)')+'<button class="btn" data-go>تأكيد</button>');
      $('[data-go]',f).onclick=async()=>{if(await W([{t:'set',c:'tickets',id,d:{status:'resolved',reply:V(f,'reply'),resolvedAt:Date.now(),resolvedBy:S.me.id}}],'تم'))closeSheet(f)};
    }
  });
}

    `<div class="helpbox" translate="no" dir="${LANG==='en'?'ltr':'rtl'}"><div class="sub">${esc(LANG==='en'?APP.nameEn:APP.name)}</div>${l.map((x,i)=>`<details class="hlp" ${i===0?'open':''}><summary>${x[0]}</summary><div class="hb2">${x[1]}</div></details>`).join('')}</div><button class="btn" data-close>${LANG==='en'?'Got it':'فهمت'}</button>`);

function helpFirst(p){
  if(!p||p.role==='admin'||p.pending||p.active===false)return;
  let seen=false;try{seen=!!localStorage.getItem('shahn_help_'+p.id)}catch(e){}
  if(seen)return;
  try{localStorage.setItem('shahn_help_'+p.id,'1')}catch(e){}
  setTimeout(()=>{if(S.me&&S.me.id===p.id&&!sheets.length)helpSheet()},900);
}
